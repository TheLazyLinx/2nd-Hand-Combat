[workspace]
members = ["crates/sim-core", "crates/sim-wasm", "crates/sim-bench"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", default-features = false }
