name: Sensitive information

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitive-information:
    name: Secrets and personal information
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test privacy rules
        run: node --test tests/privacy.test.mjs

      - name: Check project files for personal information
        run: node scripts/check-privacy.mjs

      - name: Scan Git history for secrets
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/privacy-scan.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          status=0
          "$scanner_dir/gitleaks" git . --log-opts="--all" \
            --redact=100 --no-banner --log-level=error \
            --report-format=json --report-path="$scanner_dir/findings.json" || status=$?
          if [ "$status" -eq 1 ]; then
            node scripts/report-secret-findings.mjs "$scanner_dir/findings.json"
          fi
          exit "$status"
